name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  data:
    name: Data is present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check required data files
        working-directory: backend
        run: python scripts/check_data.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install serving + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-serve.txt pytest httpx
      - name: Run the test suite
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: Dashboard lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm run test
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [data, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install serving dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-serve.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: frontend
        env:
          E2E_SERVER_CMD: "cd ../backend && python -m uvicorn app.main:app --port 8000"
        run: npx playwright test
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
