# Anubis bot-guard policy for FireHarmony (AlphaCentauriAB).
#
# Chain: internet -> nginx -> Anubis (127.0.0.1:8239) -> app (127.0.0.1:8000).
# Anubis reverse-proxies everything to TARGET except the ALLOW rules below.
# ALLOW = bypass the proof-of-work challenge.
# CHALLENGE = show the JS proof-of-work page (browsers pass once, then a
# cookie lets their fetch() calls through; bare curl/python do NOT pass).
#
# Rule of thumb for this app:
# - Health + static plumbing stays open so load-balancers and browsers boot.
# - The expensive endpoints (calendar cold ~150 s, export, backtest) are
#   challenged for EVERYONE: a scraper with a curl UA must not be able to
#   burn the server while real users wait.
# - Ops scripts (make prewarm, make e2e) must point at the backend directly:
#   BASE=http://127.0.0.1:8000 (see docs/ANUBIS.md).

store:
  # Single host, persistent across restarts. Create the dir once:
  #   sudo mkdir -p /var/lib/anubis && sudo chown <pm2-user> /var/lib/anubis
  backend: bbolt
  parameters:
    path: /var/lib/anubis/anubis.bdb

bots:
  - name: allow-health
    path_regex: ^/api/(firms/)?health$
    action: ALLOW

  - name: allow-wellknown
    path_regex: ^/\.well-known/.*$
    action: ALLOW

  - name: allow-manifest
    path_regex: ^/manifest\.webmanifest$
    action: ALLOW

  - name: allow-robots
    path_regex: ^/robots\.txt$
    action: ALLOW

  - name: allow-favicon
    path_regex: ^/favicon\.ico$
    action: ALLOW

  - name: api-expensive
    path_regex: ^/api/firms/(calendar|map-cells|export.*|brief|backtest|evaluation|coverage-xray)
    action: CHALLENGE

  - name: generic-browser
    user_agent_regex: Mozilla
    action: CHALLENGE
